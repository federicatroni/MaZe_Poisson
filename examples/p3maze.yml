# Minimal P3MaZe example: Gaussian charge smoothing and short-range correction.
grid_setting:
  N: 40
  N_p: 2
  N_typs: 2
  L_ang: 20.0
  input_file: examples/quickstart/p3maze-positions.csv
  particles_file: examples/quickstart/species.csv
  cas: CIC
  charge_smoothing: GAUSS
  smoothing_rcut_ang: 4.5
  smoothing_sigma_ang: 1.39
  y_initial_guess: BASE

md_variables:
  N_steps: 2
  T: 300
  dt_fs: 0.25
  method: MAZE-MULTIGRID
  potential: LJ
  potential_params_file: examples/quickstart/lj.csv
  elec: true
  not_elec: false
  neighbor_r_cut_ang: 4.5

output_settings:
  path: examples/quickstart/p3maze-output
  print_energy: true
  print_temperature: true
  stride: 1

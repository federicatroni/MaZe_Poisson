[build-system]
# build the package with [flit](https://flit.readthedocs.io)
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "maze_poisson"
dynamic = ["version"] # read from maze_poisson/__init__.py
description = "Molecular dynamics with Poisson MaZe and P3MaZe electrostatics"
authors = [
    { name = "Federica Troni" },
    { name = "Davide Grassano" },
]
readme = "README.md"
license = { file = "LICENSE.txt" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["MaZe", "Poisson", "molecular", "dynamics", "simulation", "analysis", "visualization"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    # "matplotlib",
    "pandas",
    "pyyaml",
    "click",
]

[project.urls]
Source = "https://github.com/federicatroni/MaZe_Poisson"
Issues = "https://github.com/federicatroni/MaZe_Poisson/issues"

[project.optional-dependencies]
fancy = [
    "rich",
    "rich_click",
]
plotting = [
    "matplotlib",
    "Pillow",
    "PyQt5",
]
tests = [
    "pytest",
    "pytest-cov",
]
pre-commit = [
    "pre-commit",
    "pylint",
    "pylint-pytest",
]
release = [
    "flit"
]

[project.scripts]
maze = "maze_poisson.cli.maze:maze"
# maze_poisson_md = "maze_poisson.scripts.main_Maze_md:main"
# maze_poisson = "maze_poisson.scripts.main_Maze:main"

[tool.flit.module]
name = "maze_poisson"

[tool.flit.sdist]
exclude = [
    ".gitignore", ".github", ".pre-commit-config.yaml",
    ]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true

[tool.pylint.main]
load-plugins = [
    "pylint_pytest"
]

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",
    "global-statement",
    "broad-exception-caught",
    "too-few-public-methods",
]


[tool.pylint.format]
max-line-length = 120
good-names = [
    "_",
    "l", "r", "b", "t",
    "l1", "r1", "b1", "t1",
    "l2", "r2", "b2", "t2",
    "i", "j",
    "k", "v",
    "f",
]

[tool.pylint.design]
max-args = 10
max-locals = 20
max-attributes = 12
